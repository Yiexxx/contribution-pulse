name: fireworks

on:
  schedule:
    - cron: "43 0 * * *"   # UTC 00:43 = 北京时间 08:43,每天一次
  workflow_dispatch:        # 允许手动触发

jobs:
  fireworks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # 推送时用我们自己的 token

      - name: 生成今日贡献烟花
        run: python3 fireworks.py

      - name: 以仓库主人身份提交并推送
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          USER_JSON=$(curl -s -H "Authorization: Bearer $GH_PAT" https://api.github.com/user)
          LOGIN=$(echo "$USER_JSON" | jq -r .login)
          USERID=$(echo "$USER_JSON" | jq -r .id)
          git config user.name  "$LOGIN"
          git config user.email "${USERID}+${LOGIN}@users.noreply.github.com"
          git add fireworks.svg
          if git diff --cached --quiet; then
            echo "烟花没有变化,跳过提交"
          else
            git commit -m "fireworks: $(date -u +%F) celebration"
            PUSH_URL="https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git"
            ok=0
            for i in 1 2 3; do
              if git push "$PUSH_URL" HEAD:main; then ok=1; break; fi
              git pull --rebase "$PUSH_URL" main || break
              sleep 3
            done
            [ "$ok" = "1" ] || { echo "推送失败"; exit 1; }
          fi
